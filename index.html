<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1 Top-Down</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,600;0,700;0,900;1,900&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0c0f; color: #e8e8e8; font: 15px 'Titillium Web', system-ui, sans-serif; }
      canvas { display: block; width: 100vw; height: 100vh; }
      * { scrollbar-color: #3a3d45 transparent; scrollbar-width: thin; }
      #ui { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
      #ui:empty { display: none; }
      .screen { pointer-events: auto; position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background:
          radial-gradient(ellipse 60% 50% at 30% 40%, rgba(225, 6, 0, 0.14), transparent 70%),
          repeating-linear-gradient(45deg, rgba(255,255,255,0.018) 0 2px, transparent 2px 6px),
          linear-gradient(160deg, #15161b, #08090b 70%); }
      .screen.overlay { background: rgba(5, 6, 8, 0.72); backdrop-filter: blur(3px); }
      .card { position: relative; width: min(460px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto; box-sizing: border-box; background: rgba(20, 21, 26, 0.92); border: 1px solid #2a2c33; border-top: 3px solid #e10600; border-radius: 16px; padding: 24px; box-shadow: 0 30px 80px rgba(0,0,0,0.55); backdrop-filter: blur(6px); }
      .card.wide { width: min(680px, calc(100vw - 32px)); }
      h1 { margin: 0 0 4px; font-size: 30px; font-weight: 900; font-style: italic; text-transform: uppercase; line-height: 1.05; color: #fff; letter-spacing: 0; }
      h1 span { color: #e10600; }
      h2 { margin: 20px 0 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.16em; color: #e10600; }
      p.sub { margin: 0 0 18px; color: #9a9da6; }
      input[type=text], input[type=number], select { box-sizing: border-box; background: #0e0f12; color: #eee; border: 1px solid #34363d; border-radius: 8px; padding: 9px 10px; font: inherit; }
      input[type=text]:focus, input[type=number]:focus, input[type=password]:focus, select:focus { outline: none; border-color: #e10600; box-shadow: 0 0 0 3px rgba(225, 6, 0, 0.25); }
      input[type=password] { box-sizing: border-box; background: #0e0f12; color: #eee; border: 1px solid #34363d; border-radius: 8px; padding: 9px 10px; font: inherit; }
      input[type=text].big { width: 100%; font-size: 16px; }
      input[type=range] { width: 160px; accent-color: #e10600; }
      input[type=checkbox] { accent-color: #e10600; width: 16px; height: 16px; }
      .account-bar { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; }
      .account-bar span { margin-right: auto; }
      .account-bar button.small { margin-left: 0; }
      label.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; color: #9a9da6; font-size: 12px; }
      label.field input { width: 100%; font-size: 15px; }
      ul.rules { list-style: none; margin: 4px 0 0; padding: 0; color: #9a9da6; font-size: 12px; line-height: 1.7; }
      ul.rules li.ok { color: #2ecc40; }
      .warn { background: #3a2a06; border: 1px solid #ffb000; color: #ffe2a0; border-radius: 8px; padding: 12px 14px; line-height: 1.5; }
      label.confirm { display: flex; align-items: center; gap: 8px; margin-top: 16px; color: #fff; cursor: pointer; }
      details { margin-top: 16px; }
      details summary { cursor: pointer; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: #8a8d96; }
      details summary:hover { color: #fff; }
      details .settings { margin-top: 10px; }
      .buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
      button { background: #23252c; color: #eee; border: 1px solid #353841; border-radius: 8px; padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer; transition: background 0.12s, border-color 0.12s, transform 0.12s; }
      button:hover:not(:disabled) { background: #2e313a; border-color: #4a4e59; }
      button:disabled { opacity: 0.45; cursor: default; }
      button.primary { background: linear-gradient(100deg, #e10600, #a8000f); border-color: #ff2a1f; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: 0.04em; box-shadow: 0 8px 24px rgba(225, 6, 0, 0.28); }
      button.primary:hover:not(:disabled) { background: linear-gradient(100deg, #f5130c, #b80012); border-color: #ff5a4f; transform: translateY(-1px); }
      .players { list-style: none; margin: 0; padding: 0; }
      .players li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #23242a; }
      .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px rgba(255,255,255,0.15); }
      .tag { font-size: 11px; color: #111; background: #ffd400; border-radius: 4px; padding: 1px 6px; font-weight: 600; }
      .tag.you { background: #8fd3ff; }
      .tag.bot { background: #b9bcc6; }
      .ping { margin-left: auto; font-size: 12px; font-weight: 600; }
      .net-note:empty { display: none; }
      button.small { padding: 2px 8px; margin-left: auto; font-size: 12px; }
      .invite { display: flex; gap: 6px; }
      .invite input { flex: 1; min-width: 0; font-size: 12px; }
      .settings { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; }
      .settings .value { color: #fff; text-align: right; }
      .muted { color: #8a8d96; font-size: 12px; line-height: 1.6; }
      .error { color: #ff6b6b; }
      table.results { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
      table.results th { text-align: left; font-size: 11px; color: #8a8d96; font-weight: 600; padding: 6px 6px; text-transform: uppercase; }
      table.results td { padding: 7px 6px; border-top: 1px solid #23242a; }
      table.results tr.me td { background: rgba(255,255,255,0.06); }
      .medals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
      @media (max-width: 560px) { .medals { grid-template-columns: repeat(2, 1fr); } }
      .medal { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; border: 1px solid #2c2d33; border-radius: 8px; color: #9a9da6; font-size: 12px; }
      .medal i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--medal); opacity: 0.6; box-sizing: border-box; }
      .medal b { color: #ddd; font-variant-numeric: tabular-nums; font-size: 14px; }
      .medal.won { border-color: var(--medal); color: var(--medal); }
      .medal.won i { background: var(--medal); opacity: 1; }
      .tyres { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 14px; }
      @media (max-width: 560px) { .tyres { grid-template-columns: repeat(2, 1fr); } }
      button.tyre { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px; text-align: center; border: 2px solid #34363d; }
      button.tyre.selected { border-color: #ffd400; background: #2a2b22; }
      button.tyre .badge { width: 34px; height: 34px; border-radius: 50%; border: 4px solid; display: flex; align-items: center; justify-content: center; font-weight: 700; background: #111; }
      button.tyre .rec { visibility: hidden; font-size: 11px; color: #2ecc40; font-weight: 600; }
      button.tyre.recommended .rec { visibility: visible; }
      .tyre-bar { width: 100%; display: flex; align-items: center; gap: 6px; font-size: 11px; color: #9a9da6; }
      .tyre-bar span { width: 26px; text-align: left; }
      .tyre-bar i { display: block; height: 6px; border-radius: 3px; background: #4dd2ff; }
      .keys { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; }
      .keys b { color: #ddd; font-weight: 600; }
      .buttons.sticky { position: sticky; bottom: -24px; margin: 16px -24px -24px; padding: 12px 24px 24px; background: linear-gradient(transparent, #15161b 14px); }
      .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
      button.chip { padding: 5px 12px; border-radius: 999px; font-size: 12px; }
      button.chip.active { background: #e10600; border-color: #ff2a1f; }
      /* Time trial track list. */
      .track-list { position: relative; margin-top: 8px; max-height: 260px; overflow-y: auto; border: 1px solid #2c2d33; border-radius: 8px; background: #121317; }
      button.track-row { display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid #1f2025; border-radius: 0; background: transparent; padding: 8px 10px; }
      button.track-row:hover:not(:disabled) { background: #1d1f25; }
      button.track-row.selected { background: #2a1418; box-shadow: inset 3px 0 #e10600; }
      button.track-row.fresh .name { color: #fff; font-weight: 600; }
      button.track-row:not(.fresh) .name { color: #a9acb5; }
      .track-row .best { color: #8a8d96; font-size: 12px; font-variant-numeric: tabular-nums; }
      .new-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; color: #111; background: #2ecc40; border-radius: 4px; padding: 1px 6px; }
      .medal-chip { font-size: 11px; font-weight: 600; color: var(--medal); border: 1px solid var(--medal); border-radius: 999px; padding: 0 7px; }
      .medal-chip.empty { border: 0; padding: 0; }
      .tt-preview { display: flex; align-items: center; gap: 16px; margin-top: 14px; padding: 10px 14px; border: 1px solid #262830; border-radius: 12px; background: rgba(0,0,0,0.25); }
      .tt-preview .circuit-art { width: 150px; height: 112px; flex: none; aspect-ratio: auto; cursor: default; }
      .tt-preview .circuit-art:hover { transform: none; }
      .tt-preview .circuit-name { white-space: normal; }
      /* Garage. */
      .garage-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .garage-balance { font-size: 18px; font-weight: 700; }
      .coins { display: inline-flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; }
      .coin { display: inline-block; width: 0.95em; height: 0.95em; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff3b0, #ffc83d 45%, #b8860b); box-shadow: inset 0 0 0 1.5px #8a6200; }
      button.purse { display: inline-flex; align-items: center; gap: 6px; position: relative; }
      .badge-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ff3b3b; box-shadow: 0 0 0 2px #15161b; margin-left: 4px; vertical-align: 2px; }
      .tabs { display: flex; gap: 4px; border-bottom: 1px solid #2c2d33; margin: 4px 0 8px; }
      button.tab { background: transparent; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 10px 14px; color: #9a9da6; }
      button.tab.active { color: #fff; border-bottom-color: #e10600; }
      button.tab:hover:not(:disabled) { background: #1d1f25; }
      .ok-note { color: #2ecc40; font-weight: 600; }
      .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
      @media (max-width: 560px) { .week { grid-template-columns: repeat(4, 1fr); } }
      .day { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border: 1px solid #2c2d33; border-radius: 8px; font-size: 11px; color: #8a8d96; text-align: center; }
      .day .coins { color: #ddd; font-size: 13px; font-weight: 600; }
      .day small { min-height: 14px; color: #2ecc40; font-weight: 600; }
      .day.done { background: #14231a; border-color: #2a5a38; }
      .day.today { border-color: #ffc83d; background: #2a2614; }
      .day.today small { color: #ffc83d; }
      .spin { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
      .wheel { flex: none; }
      .spin > div { flex: 1; min-width: 200px; }
      .skin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
      .skin { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px; border: 1px solid #2c2d33; border-radius: 10px; background: #121317; }
      .skin.equipped { border-color: #2ecc40; }
      .skin.locked .skin-preview { opacity: 0.55; filter: saturate(0.6); }
      .skin .rarity { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
      .skin button.small { margin: 4px 0 0; display: inline-flex; align-items: center; gap: 4px; }
      .skin button.equipped { color: #2ecc40; opacity: 1; }
      .unlock { width: 100%; font-size: 11px; color: #9a9da6; text-align: center; }
      .progress { height: 5px; border-radius: 3px; background: #2b2d34; margin-top: 4px; overflow: hidden; }
      .progress i { display: block; height: 100%; }
      /* Welcome screen. */
      .screen.home { display: block; overflow-y: auto; }
      .home-grid { min-height: 100%; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(320px, 460px); gap: 40px; align-items: center; max-width: 1180px; margin: 0 auto; padding: 40px 32px; }
      .hero { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
      .wordmark { display: flex; align-items: baseline; gap: 14px; font-weight: 900; font-style: italic; text-transform: uppercase; line-height: 0.9; font-size: clamp(44px, 6.4vw, 84px); letter-spacing: -0.01em; color: #fff; }
      .wordmark .f1 { color: #e10600; position: relative; padding-right: 4px; }
      .wordmark .f1::after { content: ''; position: absolute; left: 0; right: 0; bottom: -10px; height: 6px; background: repeating-linear-gradient(90deg, #e10600 0 18px, #fff 18px 36px); transform: skewX(-20deg); }
      .tagline { margin: 14px 0 0; max-width: 34em; color: #a6a9b3; font-size: 17px; line-height: 1.45; }
      .showcase { margin-top: 18px; display: flex; flex-direction: column; gap: 12px; }
      .circuit-art { aspect-ratio: 4 / 3; max-height: 48vh; cursor: pointer; transition: transform 0.25s; }
      .circuit-art:hover { transform: scale(1.015); }
      .circuit-art.enter { animation: circuit-in 0.45s ease-out; }
      @keyframes circuit-in { from { opacity: 0; transform: translateX(14px) scale(0.98); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .circuit-art.enter { animation: none; } }
      .circuit-bar { display: flex; align-items: center; gap: 10px; }
      .circuit-title { display: flex; flex-direction: column; min-width: 0; flex: 0 1 auto; }
      .circuit-label { font-size: 11px; font-weight: 700; color: #e10600; letter-spacing: 0.18em; text-transform: uppercase; }
      .circuit-count { color: #6f727c; letter-spacing: 0.06em; }
      .circuit-name { font-weight: 900; font-style: italic; font-size: 26px; line-height: 1.05; color: #fff; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .circuit-bar button.arrow { flex: none; width: 38px; height: 38px; padding: 0; border-radius: 50%; font-size: 22px; line-height: 1; background: #1c1e24; border-color: #2f323a; }
      .circuit-bar button.arrow:hover { border-color: #e10600; color: #fff; }
      .circuit-bar button.drive { margin-left: auto; flex: none; font-family: inherit; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-size: 13px; background: transparent; border: 1px solid #e10600; color: #fff; border-radius: 999px; padding: 8px 16px; }
      .circuit-bar button.drive:hover { background: #e10600; }
      .circuit-bar button.drive span { display: inline-block; transition: transform 0.15s; }
      .circuit-bar button.drive:hover span { transform: translateX(3px); }
      .circuit-stats { display: flex; gap: 28px; flex-wrap: wrap; }
      .circuit-stats div { display: flex; flex-direction: column; }
      .circuit-stats span { font-size: 11px; color: #6f727c; text-transform: uppercase; letter-spacing: 0.14em; font-weight: 600; }
      .circuit-stats b { font-size: 16px; color: #e8e8e8; font-variant-numeric: tabular-nums; }
      .circuit { width: 100%; height: 100%; overflow: visible; }
      .circuit .road-glow { fill: none; stroke: rgba(225, 6, 0, 0.12); stroke-linejoin: round; filter: blur(6px); }
      .circuit .road { fill: none; stroke: #2a2c33; stroke-linejoin: round; }
      .circuit .road-line { fill: none; stroke: rgba(255,255,255,0.35); stroke-dasharray: 2 3; stroke-linejoin: round; }
      .circuit .trail { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 3px currentColor); opacity: 0.9; }
      .circuit .car { fill: currentColor; stroke: #fff; stroke-width: 0.6px; vector-effect: non-scaling-stroke; filter: drop-shadow(0 0 3px currentColor); }
      .circuit .start { fill: #fff; }
      .home-panel { background: rgba(20, 21, 26, 0.82); border: 1px solid #2a2c33; border-radius: 16px; padding: 22px; box-shadow: 0 30px 80px rgba(0,0,0,0.55); backdrop-filter: blur(6px); }
      .home-panel .field span { text-transform: uppercase; letter-spacing: 0.12em; font-size: 11px; font-weight: 600; }
      .home-panel input[type=text].big { font-family: inherit; font-size: 17px; font-weight: 600; padding: 11px 12px; border-radius: 8px; }
      .home-panel input[type=text].big:focus { outline: none; border-color: #e10600; box-shadow: 0 0 0 3px rgba(225, 6, 0, 0.25); }
      .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
      button.tile { position: relative; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 12px; row-gap: 1px; align-items: center; text-align: left; padding: 13px 14px; border-radius: 10px; background: #1c1e24; border: 1px solid #2c2f37; font-family: inherit; transition: transform 0.12s, border-color 0.12s, background 0.12s; }
      button.tile:hover:not(:disabled) { background: #23262e; border-color: #4a4e59; transform: translateY(-2px); }
      button.tile .icon { grid-row: span 2; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: #2a2d35; color: #ff5a4f; }
      button.tile .icon svg { width: 20px; height: 20px; }
      button.tile b { font-size: 15px; font-weight: 700; color: #fff; line-height: 1.2; }
      button.tile small { font-size: 12px; color: #8f929c; line-height: 1.3; }
      button.tile.wide { grid-column: 1 / -1; }
      button.tile.primary { grid-column: 1 / -1; padding: 16px 18px; background: linear-gradient(100deg, #e10600, #a8000f); border-color: #ff2a1f; box-shadow: 0 10px 30px rgba(225, 6, 0, 0.3); }
      button.tile.primary:hover:not(:disabled) { background: linear-gradient(100deg, #f5130c, #b80012); border-color: #ff5a4f; }
      button.tile.primary .icon { background: rgba(255,255,255,0.18); color: #fff; width: 40px; height: 40px; }
      button.tile.primary b { font-size: 19px; text-transform: uppercase; letter-spacing: 0.04em; font-style: italic; font-weight: 900; }
      button.tile.primary small { color: rgba(255,255,255,0.8); }
      .home-panel details { margin-top: 14px; border-top: 1px solid #262830; padding-top: 12px; }
      .home-panel .account-bar { padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid #262830; }
      @media (max-width: 860px) {
        .home-grid { grid-template-columns: 1fr; gap: 18px; padding: 24px 16px; }
        .circuit-art { max-height: 30vh; aspect-ratio: auto; height: 30vh; }
        .circuit-name { font-size: 20px; }
        .tagline { font-size: 15px; }
      }
      @media (max-width: 420px) { .tiles { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
