<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1 Top-Down</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #e8e8e8; font: 14px system-ui, sans-serif; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #ui { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
      #ui:empty { display: none; }
      .screen { pointer-events: auto; position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 30%, #1d2a1b, #0c0d10 70%); }
      .screen.overlay { background: rgba(5, 6, 8, 0.72); }
      .card { width: min(440px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto; box-sizing: border-box; background: #17181c; border: 1px solid #2c2d33; border-radius: 12px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
      .card.wide { width: min(640px, calc(100vw - 32px)); }
      h1 { margin: 0 0 4px; font-size: 26px; color: #fff; letter-spacing: 0.02em; }
      h1 span { color: #e10600; }
      h2 { margin: 18px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #8a8d96; }
      p.sub { margin: 0 0 18px; color: #9a9da6; }
      input[type=text], input[type=number], select { box-sizing: border-box; background: #0e0f12; color: #eee; border: 1px solid #34363d; border-radius: 6px; padding: 9px 10px; font: inherit; }
      input[type=text].big { width: 100%; font-size: 16px; }
      .buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
      button { background: #2b2d34; color: #eee; border: 1px solid #3a3d45; border-radius: 6px; padding: 10px 16px; font: inherit; cursor: pointer; }
      button:hover:not(:disabled) { background: #363943; }
      button:disabled { opacity: 0.45; cursor: default; }
      button.primary { background: #c8102e; border-color: #e0223f; font-weight: 600; }
      button.primary:hover:not(:disabled) { background: #dd1a38; }
      .players { list-style: none; margin: 0; padding: 0; }
      .players li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #23242a; }
      .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px rgba(255,255,255,0.15); }
      .tag { font-size: 11px; color: #111; background: #ffd400; border-radius: 4px; padding: 1px 6px; font-weight: 600; }
      .tag.you { background: #8fd3ff; }
      .invite { display: flex; gap: 6px; }
      .invite input { flex: 1; min-width: 0; font-size: 12px; }
      .settings { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; }
      .settings .value { color: #fff; text-align: right; }
      .muted { color: #8a8d96; font-size: 12px; line-height: 1.6; }
      .error { color: #ff6b6b; }
      table.results { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
      table.results th { text-align: left; font-size: 11px; color: #8a8d96; font-weight: 600; padding: 6px 6px; text-transform: uppercase; }
      table.results td { padding: 7px 6px; border-top: 1px solid #23242a; }
      table.results tr.me td { background: rgba(255,255,255,0.06); }
      .keys { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; }
      .keys b { color: #ddd; font-weight: 600; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
